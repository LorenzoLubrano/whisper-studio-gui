[pytest]
testpaths = tests
# --capture=sys: la cattura a livello di descrittori (predefinita) disturba l'avvio di Tcl
# quando si creano molte finestre Tk di seguito ("Can't find a usable tk.tcl" a caso)
addopts = -m "not slow" --capture=sys
markers =
    slow: prove complete con il motore vero (modello tiny su CPU); eseguile con  pytest -m slow
